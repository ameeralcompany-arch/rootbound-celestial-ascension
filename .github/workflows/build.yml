  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Package
        run: |
          copy index.html desktop\index.html
          Copy-Item audio desktop\audio -Recurse -Force
          Copy-Item assets desktop\assets -Recurse -Force
          cd desktop
          npm install
          npx electron-packager . Rootbound --platform=win32 --arch=x64 --out=dist --overwrite --asar
          node harden.js dist\Rootbound-win32-x64\Rootbound.exe
          copy Rootbound-Safe-Mode.bat dist\Rootbound-win32-x64\
        shell: pwsh
      - name: Launch the packaged app and verify the game reaches its first frame
        run: |
          $exe="desktop\dist\Rootbound-win32-x64\Rootbound.exe"
          if(-not (Test-Path $exe)){throw "exe missing"}
          $p=Start-Process $exe -ArgumentList "--smoke" -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt -PassThru
          if(-not $p.WaitForExit(60000)){$p.Kill();Get-Content smoke.txt,smoke-err.txt;throw "packaged app did not finish smoke test"}
          Get-Content smoke.txt
          if((Get-Content smoke.txt -Raw) -notmatch "SMOKE-OK"){throw "packaged app did not reach ready state"}
        shell: pwsh
      - run: Compress-Archive -Path desktop\dist\Rootbound-win32-x64 -DestinationPath Rootbound-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: {name: Rootbound-Windows, path: Rootbound-Windows.zip}
