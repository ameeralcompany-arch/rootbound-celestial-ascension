<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Rootbound symbol">
  <!-- The Rootbound symbol: a sapling whose roots curl round into a ring (the world it holds together), under a small star. Original artwork. -->
  <defs>
    <linearGradient id="rbGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8E6"/><stop offset=".45" stop-color="#F4D59A"/><stop offset=".8" stop-color="#D9B773"/><stop offset="1" stop-color="#F1DDA8"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#rbGold)" stroke-linecap="round" stroke-linejoin="round">
    <path class="rb-ring" d="M52.5 11.6 A49 49 0 1 0 67.5 11.6" stroke-width="3.2"/>
    <path class="rb-trunk" d="M60 86 C58.6 74 61.4 62 60 40" stroke-width="3.6"/>
    <path class="rb-root" d="M60 86 C55 92 46 96 37 104" stroke-width="2.6"/>
    <path class="rb-root" d="M60 86 C60.6 94 60 100 60 109" stroke-width="2.6"/>
    <path class="rb-root" d="M60 86 C65 92 74 96 83 104" stroke-width="2.6"/>
    <path class="rb-root" d="M53 93 C49 92 45 93 41 90" stroke-width="1.8"/>
    <path class="rb-root" d="M67 93 C71 92 75 93 79 90" stroke-width="1.8"/>
  </g>
  <g fill="url(#rbGold)">
    <path class="rb-leaf" d="M60 55 C52 54 44 49 39 40 C49 39 57 44 60 55 Z"/>
    <path class="rb-leaf" d="M60.4 47 C67 45 76 39 81 30 C70 30 62 36 60.4 47 Z"/>
    <path class="rb-star" d="M60 2.5 L62.2 9.3 L69 11.5 L62.2 13.7 L60 20.5 L57.8 13.7 L51 11.5 L57.8 9.3 Z"/>
